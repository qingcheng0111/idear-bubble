<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>idear 泡泡</title>
<style>
  :root {
    --bg: #f6f5ef;
    --ink: #302c3b;
    --ink-2: #6f6a7b;
    --ink-3: #736d7b;
    --line: rgba(48, 44, 59, 0.09);
    --card: rgba(255, 255, 255, 0.74);
    --accent: #5a44d4;
    --accent-2: #4a36c0;
    --ring: rgba(48, 44, 59, 0.78);
    --panel-w: 320px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(55% 50% at 45% 50%, rgba(255, 233, 242, 0.75), transparent 72%),
      radial-gradient(35% 40% at 92% 92%, rgba(216, 238, 222, 0.8), transparent 70%),
      radial-gradient(35% 35% at 4% 8%, rgba(232, 227, 250, 0.7), transparent 70%),
      var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .app { height: 100vh; display: flex; flex-direction: column; }

  /* ---------- 顶栏 ---------- */
  .top { display: flex; align-items: center; gap: 20px; padding: 18px 28px 4px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .logo {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 38% 34%, #fff 0%, #ece6fc 55%, #dcd2f7 100%);
    border: 1.5px dashed #9b8cd9;
  }
  .brand h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: baseline; gap: 8px; }
  .brand h1 small { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
  .brand p { margin: 3px 0 0; font-size: 12px; color: var(--ink-2); }
  .search {
    flex: 1; max-width: 440px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line);
  }
  .search svg { flex: none; color: var(--ink-2); }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 14px; }
  .search input::placeholder { color: var(--ink-3); }
  .search:focus-within { border-color: rgba(90, 68, 212, 0.35); box-shadow: 0 0 0 3px rgba(90, 68, 212, 0.08); }
  .actions { display: flex; align-items: center; gap: 10px; position: relative; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card); font-size: 14px; cursor: pointer; white-space: nowrap;
    transition: background 0.15s, transform 0.15s;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 8px 18px rgba(90, 68, 212, 0.28); }
  .btn.primary:hover { background: var(--accent-2); }
  .menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; width: 220px; padding: 6px;
    background: rgba(255, 255, 255, 0.95); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 40px -18px rgba(40, 30, 80, 0.35);
  }
  .menu[hidden] { display: none; }
  .menu button {
    width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 9px 10px;
    border: 0; border-radius: 10px; background: transparent; cursor: pointer; font-size: 14px; text-align: left;
  }
  .menu button:hover { background: rgba(90, 68, 212, 0.07); }
  .menu small { font-size: 11px; color: var(--ink-3); }

  /* ---------- 面包屑 + 计数 ---------- */
  .subbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 30px 0; font-size: 13px; }
  .crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-width: 0; }
  .crumbs .sep { color: var(--ink-3); }
  .crumb { border: 0; background: transparent; padding: 2px 5px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-size: 13px; }
  .crumb:hover { background: rgba(48, 44, 59, 0.06); color: var(--ink); }
  .crumb.current { color: var(--ink); font-weight: 600; cursor: default; }
  .crumb.current:hover { background: transparent; }
  .count { color: var(--ink-3); white-space: nowrap; }

  /* ---------- 泡泡地图 ---------- */
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; transition: transform 0.42s cubic-bezier(0.45, 0, 0.2, 1), opacity 0.42s ease; }
  .layer.leaving-in { transform: scale(2.4); opacity: 0; }
  .layer.leaving-out { transform: scale(0.6); opacity: 0; }
  .bubble {
    --c: 243 190 214; --d: 93;
    position: absolute; left: 0; top: 0; border-radius: 50%;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; will-change: transform;
    transition: opacity 0.25s ease, filter 0.25s ease;
  }
  .bubble.dragging { cursor: grabbing; z-index: 5; }
  .bi { position: absolute; inset: 0; border-radius: 50%; transition: transform 0.25s ease; }
  .bubble:hover .bi { transform: scale(1.035); }
  .bubble.dragging .bi { transform: scale(1.06); }
  .skin {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%,
      rgb(255 255 255 / 0.55) 0%, rgb(var(--c) / 0.8) 40%, rgb(var(--c) / 0.96) 70%, rgb(var(--c) / 0.5) 91%, rgb(var(--c) / 0) 100%);
    box-shadow: 0 12px 24px -18px rgba(40, 30, 60, 0.35);
  }
  .bubble.selected .bi::after {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    border: 1.5px solid var(--ring); pointer-events: none;
  }
  .stage.searching .bubble:not(.hit) { opacity: 0.22; filter: grayscale(0.4); }
  .stage.searching .bubble.hit .bi::before {
    content: ""; position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid rgba(90, 68, 212, 0.6); pointer-events: none;
  }
  .body {
    position: absolute; inset: 12%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; text-align: center; pointer-events: none;
  }
  .kicker, .chips, .enter { display: none; }
  .sz-m .kicker, .sz-l .kicker { display: block; }
  .sz-m.has-kids .enter, .sz-l.has-kids .enter { display: block; }
  .sz-l.has-kids .chips { display: flex; }
  .kicker { font-size: 11px; color: #5f596b; }
  .name {
    font-weight: 600; color: #37323f; line-height: 1.3; word-break: break-word;
    font-size: clamp(11px, calc(var(--d) * 0.125px), 14px);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sz-m .name, .sz-l .name { font-size: clamp(15px, calc(var(--d) * 0.085px), 23px); font-weight: 700; }
  .chips { flex-wrap: wrap; justify-content: center; gap: 5px; margin-top: 4px; max-width: 100%; }
  .chips span {
    font-size: 11px; padding: 3px 8px; border-radius: 8px; background: rgb(255 255 255 / 0.55); color: #4a4555;
    max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .enter { font-size: 11px; color: #5f596b; margin-top: 3px; }

  /* ---------- 底栏 ---------- */
  .foot {
    position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding: 6px 24px 14px; font-size: 12px; color: var(--ink-3);
  }
  .tray-btn {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px; border: 0; border-radius: 10px;
    background: transparent; color: var(--ink-2); font-size: 12px; cursor: pointer;
  }
  .tray-btn:hover { background: rgba(48, 44, 59, 0.05); }
  .tray-count { padding: 1px 7px; border-radius: 8px; background: rgba(48, 44, 59, 0.07); font-size: 11px; }
  .hint { justify-self: center; white-space: nowrap; }
  .saved { justify-self: end; white-space: nowrap; transition: color 0.3s; }
  .saved.pulse { color: #4c8a5a; }
  .saved.warn { color: #c0504d; }
  .tray-pop {
    position: absolute; left: 20px; bottom: 46px; z-index: 30; width: 270px; max-height: 300px; overflow: auto; padding: 12px;
    background: rgba(255, 255, 255, 0.95); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 40px -18px rgba(40, 30, 80, 0.35); color: var(--ink);
  }
  .tray-pop[hidden] { display: none; }
  .tray-pop h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .tray-pop ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tray-pop li { display: flex; justify-content: space-between; gap: 10px; align-items: center; font-size: 13px; }
  .tray-pop li .dot { width: 10px; height: 10px; border-radius: 50%; background: rgb(var(--c)); flex: none; }
  .tray-pop li .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tray-pop li time { font-size: 11px; color: var(--ink-3); }
  .tray-pop .empty { font-size: 12px; color: var(--ink-3); }

  /* ---------- 右侧面板「这一颗想法」 ---------- */
  .panel {
    position: fixed; top: 74px; right: 20px; z-index: 20; width: min(var(--panel-w), calc(100vw - 24px));
    max-height: calc(100vh - 94px); overflow: auto; padding: 14px 18px 18px;
    background: rgba(255, 255, 255, 0.86); border: 1px solid var(--line); border-radius: 20px;
    -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
    box-shadow: 0 24px 60px -20px rgba(40, 30, 80, 0.25);
    transform: translateX(calc(100% + 40px)); opacity: 0; pointer-events: none;
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
  }
  .panel.open { transform: none; opacity: 1; pointer-events: auto; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
  .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 20px; line-height: 1; cursor: pointer; }
  .icon-btn:hover { background: rgba(48, 44, 59, 0.06); }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; margin-bottom: 6px; font-size: 12px; color: var(--ink-2); }
  .field input[type="text"], .field textarea, .field select {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px;
    background: rgba(255, 255, 255, 0.75); font-size: 14px; outline: none;
  }
  .field input[type="text"]:focus, .field textarea:focus, .field select:focus { border-color: #8070e0; box-shadow: 0 0 0 3px rgba(90, 68, 212, 0.12); }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  .swatches { display: flex; gap: 10px; }
  .swatch {
    position: relative; width: 28px; height: 28px; border: 0; border-radius: 50%; cursor: pointer;
    background: rgb(var(--c)); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
  }
  .swatch[aria-checked="true"] { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ring); }
  .swatch[aria-checked="true"]::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: #4a3c66; }
  .sizebox { margin: -6px 0 14px; padding: 10px 12px; border-radius: 12px; background: rgba(90, 68, 212, 0.06); font-size: 12px; }
  .sizebox b { display: block; font-weight: 500; color: var(--ink); }
  .sizebox small { display: block; margin-top: 3px; color: var(--ink-3); font-size: 11px; }
  .sizebox .manual-info { display: none; }
  .sizebox.manual .auto-info { display: none; }
  .sizebox.manual .manual-info { display: block; }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row input { flex: 1; accent-color: var(--accent); }
  .blow {
    width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
    border: 0; border-radius: 12px; background: #e3f1df; color: #3f6b48; font-size: 14px; cursor: pointer;
  }
  .blow:hover { background: #d7ebd2; }
  .blow small { font-size: 11px; color: #4f7357; }
  .panel-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .link-danger { padding: 6px 0; border: 0; background: transparent; color: var(--ink-3); font-size: 13px; cursor: pointer; }
  .link-danger:hover { color: #c0504d; }

  @media (max-width: 760px) {
    .top { flex-wrap: wrap; padding: 14px 16px 4px; gap: 10px; }
    .brand { min-width: 0; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .subbar { padding: 10px 16px 0; }
    .foot { padding: 6px 12px 12px; grid-template-columns: 1fr auto; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div>
        <h1>idear 泡泡 <small>v1.0</small></h1>
        <p>我的想法，有地方住了。</p>
      </div>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="search" placeholder="找找脑袋里的想法..." autocomplete="off" />
    </label>
    <div class="actions">
      <button class="btn" id="backupBtn" aria-haspopup="menu" aria-expanded="false">备份 <span aria-hidden="true">⇅</span></button>
      <button class="btn primary" id="newBtn">+ 新建泡泡</button>
      <div class="menu" id="backupMenu" role="menu" hidden>
        <button role="menuitem" id="exportBtn">导出备份<small>下载一个 .json 文件</small></button>
        <button role="menuitem" id="importBtn">从备份恢复<small>会替换现在脑袋里的泡泡</small></button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <div class="subbar">
    <nav class="crumbs" id="crumbs" aria-label="所在位置"></nav>
    <div class="count" id="count"></div>
  </div>

  <main class="stage" id="stage">
    <div class="layer" id="layer"></div>
  </main>

  <footer class="foot">
    <button class="tray-btn" id="trayBtn" aria-expanded="false">
      <svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><circle cx="6" cy="9" r="5" fill="#f3bdd5" opacity=".8"/><circle cx="13" cy="7" r="6" fill="#d7ccf4" opacity=".8"/><circle cx="16.5" cy="12.5" r="3" fill="#bcdcf1" opacity=".9"/></svg>
      已完成的小泡泡 <span class="tray-count" id="trayCount">0</span>
    </button>
    <div class="hint">松手后慢慢散开 · 双击走进泡泡</div>
    <div class="saved" id="saved">✓ 已保存在此浏览器</div>
    <div class="tray-pop" id="trayPop" hidden>
      <h3>已完成的小泡泡</h3>
      <ul id="trayList"></ul>
    </div>
  </footer>
</div>

<aside class="panel" id="panel" aria-hidden="true" aria-label="这一颗想法">
  <div class="panel-head"><span>这一颗想法</span><button class="icon-btn" id="panelClose" aria-label="关闭">×</button></div>
  <label class="field"><span>名字</span><input type="text" id="fName" maxlength="60" /></label>
  <label class="field"><span>脑子里想到的</span><textarea id="fNote" rows="5" placeholder="不用整理好，先放在这里。"></textarea></label>
  <div class="field"><span>泡泡颜色</span><div class="swatches" id="fColors" role="radiogroup" aria-label="泡泡颜色"></div></div>
  <label class="field"><span>大小方式</span>
    <select id="fSizeMode">
      <option value="auto">跟着里面的小泡泡长大</option>
      <option value="manual">我来决定它多大</option>
    </select>
  </label>
  <div class="sizebox" id="sizeBox">
    <div class="auto-info"><b id="sizeLine">0 个小泡泡 · 自动大小 93</b><small>屏幕拥挤时，会一起缩小一点。</small></div>
    <div class="manual-info">
      <div class="range-row"><input type="range" id="fSize" min="60" max="320" step="1" aria-label="泡泡大小" /><b id="sizeVal">160</b></div>
      <small>不跟着里面的小泡泡变；屏幕拥挤时，也会一起缩小一点。</small>
    </div>
  </div>
  <label class="field"><span>放在哪里</span><select id="fParent"></select></label>
  <button class="blow" id="blowBtn"><span>吹掉泡泡 ↗</span><small>这件事，我完成啦</small></button>
  <div class="panel-foot">
    <button class="link-danger" id="deleteBtn">删除泡泡</button>
    <button class="btn primary" id="saveBtn">保存想法</button>
  </div>
</aside>

<script>
(() => {
  'use strict';

  // ---------- 常量 ----------
  const APP_NAME = 'idear 泡泡';
  const APP_ID = 'idear-bubble';
  const APP_VERSION = '1.0';
  const STORE_KEY = 'idear-bubble.v1';
  const LEGACY_KEYS = ['bubble-brain.v0.2'];   // 旧版本（泡泡脑袋 v0.2）的存储键，只读不删
  const COLORS = {
    peach:  { label: '蜜桃', rgb: [247, 200, 160] },
    blue:   { label: '天蓝', rgb: [184, 217, 240] },
    green:  { label: '薄荷', rgb: [198, 232, 196] },
    pink:   { label: '粉红', rgb: [243, 190, 214] },
    yellow: { label: '柠檬', rgb: [242, 227, 136] },
    purple: { label: '薰衣草', rgb: [215, 204, 244] },
  };
  const COLOR_ORDER = ['peach', 'blue', 'green', 'pink', 'yellow', 'purple'];
  const AUTO_BASE = 93;          // 没有小泡泡时的自动大小（视频帧 101）
  const AUTO_GROW = 64;          // 小泡泡越多越大：93 + 64·√n
  const MIN_SIZE = 60, MAX_SIZE = 320;
  const CROWD_FILL = 0.36;       // 泡泡总面积超过画布这个比例时，一起缩小
  const GAP = 14;                // 泡泡之间留的空隙
  const SIZE_MEDIUM = 120;       // 显示直径 ≥ 120：显示「一颗想法 / N 个小想法」
  const SIZE_LARGE = 255;        // 显示直径 ≥ 255：再显示最多 3 个小想法标签
  const CLICK_DELAY = 240;       // 单击等一下，留给双击

  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const uid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const autoSize = (n) => Math.round(AUTO_BASE + AUTO_GROW * Math.sqrt(n));

  // ---------- 数据 ----------
  function seed() {
    const t = Date.now();
    let k = 0;
    const mk = (name, color, x, y, more = {}) => ({
      id: 'seed-' + (++k), name, note: '', color, sizeMode: 'auto', size: 160, parentId: null,
      done: false, doneAt: null, createdAt: t, pos: { x, y }, ...more,
    });
    const ielts = mk('IELTS / AI 雅思', 'blue', 0.64, 0.72);
    const course = mk('上课', 'pink', 0.33, 0.66);
    const list = [
      mk('zine', 'yellow', 0.09, 0.22),
      mk('整理所有的爆款视频+codex推理', 'pink', 0.30, 0.27, { sizeMode: 'manual', size: 230 }),
      mk('房间照片墙', 'peach', 0.50, 0.46),
      mk('九月找whd玩', 'pink', 0.64, 0.22),
      mk('🙆工作汇报', 'yellow', 0.87, 0.20),
      mk('视频号', 'pink', 0.07, 0.50),
      mk('烫头发', 'green', 0.84, 0.52),
      mk('Codex 小项目', 'purple', 0.08, 0.80),
      course,
      mk('拼豆', 'yellow', 0.20, 0.88),
      ielts,
      mk('攀岩', 'pink', 0.90, 0.86),
    ];
    const kid = (p, name, x, y) => mk(name, p.color, x, y, { parentId: p.id });
    list.push(
      kid(ielts, 'AI 雅思网站', 0.12, 0.45),
      kid(ielts, 'mybubble口播', 0.30, 0.22),
      kid(ielts, '脚本', 0.82, 0.30),
      kid(ielts, '资料产品', 0.30, 0.78),
      kid(ielts, '视频脚本or灵感', 0.72, 0.80),
      kid(ielts, '口语题库', 0.55, 0.50),
      kid(course, '作业', 0.30, 0.30),
      kid(course, '小组展示', 0.70, 0.40),
      kid(course, '期末复习', 0.50, 0.75),
      mk('整理桌面', 'green', 0.5, 0.5, { done: true, doneAt: t - 86400000 }),
    );
    return { bubbles: list };
  }

  // 读入外部数据（本地存储或备份文件）时逐项校验，坏数据不进入程序
  function sanitize(raw) {
    if (!raw || !Array.isArray(raw.bubbles)) return null;
    const seen = new Set();
    const list = [];
    for (const b of raw.bubbles) {
      if (!b || typeof b.id !== 'string' || !b.id || seen.has(b.id)) continue;
      seen.add(b.id);
      const px = Number(b.pos && b.pos.x), py = Number(b.pos && b.pos.y);
      list.push({
        id: b.id,
        name: String(b.name ?? '').slice(0, 60).trim() || '未命名的想法',
        note: String(b.note ?? ''),
        color: Object.prototype.hasOwnProperty.call(COLORS, b.color) ? b.color : 'pink',
        sizeMode: b.sizeMode === 'manual' ? 'manual' : 'auto',
        size: clamp(Math.round(Number(b.size) || 160), MIN_SIZE, MAX_SIZE),
        parentId: typeof b.parentId === 'string' && b.parentId ? b.parentId : null,
        done: !!b.done,
        doneAt: Number(b.doneAt) || null,
        createdAt: Number(b.createdAt) || Date.now(),
        pos: Number.isFinite(px) && Number.isFinite(py) ? { x: clamp(px, 0, 1), y: clamp(py, 0, 1) } : null,
      });
    }
    const map = new Map(list.map((b) => [b.id, b]));
    for (const b of list) if (b.parentId && !map.has(b.parentId)) b.parentId = null;
    for (const b of list) { // 父子关系成环时，放回主地图
      const chain = new Set([b.id]);
      let p = b.parentId;
      while (p) {
        if (chain.has(p)) { b.parentId = null; break; }
        chain.add(p);
        p = map.get(p) ? map.get(p).parentId : null;
      }
    }
    return { bubbles: list };
  }

  function load() {
    let text = null;
    try { text = localStorage.getItem(STORE_KEY); } catch (e) { /* 存储不可用 */ }
    if (!text) { // 第一次以新名字打开：沿用旧版本存下的泡泡
      for (const k of LEGACY_KEYS) {
        try { text = localStorage.getItem(k); } catch (e) { /* 存储不可用 */ }
        if (text) break;
      }
    }
    if (text) {
      try {
        const data = sanitize(JSON.parse(text));
        if (data) return data;
      } catch (e) { /* 解析失败，下面留底 */ }
      try { localStorage.setItem(STORE_KEY + '.broken-' + Date.now(), text); } catch (e) { /* 忽略 */ }
    }
    return seed();
  }

  let state = load();
  let view = null;          // 当前所在的泡泡 id；null = 主地图
  let selectedId = null;    // 有描边的泡泡
  let draft = null;         // 面板里尚未保存的修改
  let query = '';
  let busy = false;         // 进出泡泡的过渡动画中

  const byId = (id) => state.bubbles.find((b) => b.id === id) || null;
  const childrenOf = (pid) => state.bubbles.filter((b) => !b.done && b.parentId === pid);
  function descendantsOf(id) {
    const out = [];
    const walk = (pid) => { for (const b of state.bubbles) if (b.parentId === pid) { out.push(b); walk(b.id); } };
    walk(id);
    return out;
  }
  function pathIds(id) {
    const out = [];
    let cur = id ? byId(id) : null;
    while (cur) { out.unshift(cur.id); cur = cur.parentId ? byId(cur.parentId) : null; }
    return out;
  }
  const eff = (b) => (draft && draft.id === b.id ? { ...b, ...draft } : b);
  function baseDiameter(b) {
    const e = eff(b);
    return e.sizeMode === 'manual' ? e.size : autoSize(childrenOf(b.id).length);
  }

  // ---------- 保存 ----------
  const savedEl = $('#saved');
  let pulseTimer = null;
  function persist() {
    savePositions();
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ app: APP_ID, version: APP_VERSION, bubbles: state.bubbles }));
      savedEl.textContent = '✓ 已保存在此浏览器';
      savedEl.classList.remove('warn');
      savedEl.classList.add('pulse');
      clearTimeout(pulseTimer);
      pulseTimer = setTimeout(() => savedEl.classList.remove('pulse'), 900);
    } catch (e) {
      savedEl.textContent = '⚠ 没能保存在此浏览器（存储不可用或已满）';
      savedEl.classList.add('warn');
    }
  }

  // ---------- 泡泡地图 ----------
  const stage = $('#stage');
  const layer = $('#layer');
  let W = 0, H = 0;
  let nodes = new Map();
  let crowd = 1;

  function measure() {
    const r = stage.getBoundingClientRect();
    W = r.width; H = r.height;
  }
  function savePositions() {
    if (!W || !H) return;
    for (const n of nodes.values()) {
      const b = byId(n.id);
      if (b) b.pos = { x: clamp(n.x / W, 0, 1), y: clamp(n.y / H, 0, 1) };
    }
  }

  function addNode(b, { appear = false } = {}) {
    const el = document.createElement('div');
    el.className = 'bubble';
    el.dataset.id = b.id;
    el.setAttribute('role', 'button');
    el.innerHTML = '<div class="bi"><div class="skin"></div><div class="body">' +
      '<div class="kicker"></div><div class="name"></div><div class="chips"></div><div class="enter">双击进入 ↗</div>' +
      '</div></div>';
    layer.appendChild(el);
    const p = b.pos || { x: 0.25 + Math.random() * 0.5, y: 0.25 + Math.random() * 0.5 };
    const node = { id: b.id, el, x: p.x * W, y: p.y * H, vx: 0, vy: 0, d: AUTO_BASE, shown: -1, cls: '', phase: Math.random() * Math.PI * 2 };
    nodes.set(b.id, node);
    if (appear) {
      el.querySelector('.bi').animate(
        [{ transform: 'scale(.3)', opacity: 0 }, { transform: 'scale(1.06)', opacity: 1, offset: 0.7 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    return node;
  }

  // 泡泡破掉 / 被移走：从地图上带动画拿掉
  function popNode(id, mode = 'pop') {
    const n = nodes.get(id);
    if (!n) return;
    nodes.delete(id);
    // 立刻退出交互与无障碍树；动画结束或兜底计时到了就移除（后台标签页里动画可能不跑完）
    n.el.removeAttribute('aria-label');
    n.el.removeAttribute('role');
    n.el.style.pointerEvents = 'none';
    n.el.classList.add('dying');
    const remove = () => n.el.remove();
    setTimeout(remove, 700);
    const frames = mode === 'pop'
      ? [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.35)', opacity: 0 }]
      : [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.2)', opacity: 0 }];
    const anim = n.el.querySelector('.bi').animate(frames, { duration: mode === 'pop' ? 380 : 320, easing: 'ease-out', fill: 'forwards' });
    anim.onfinish = remove;
  }

  function refreshNode(id) {
    const n = nodes.get(id);
    const b = byId(id);
    if (!n || !b) return;
    const e = eff(b);
    const kids = childrenOf(id);
    n.d = baseDiameter(b);
    n.el.style.setProperty('--c', COLORS[e.color].rgb.join(' '));
    n.el.querySelector('.kicker').textContent = kids.length ? `${kids.length} 个小想法` : '一颗想法';
    n.el.querySelector('.name').textContent = e.name.trim() || '未命名的想法';
    const chips = n.el.querySelector('.chips');
    chips.textContent = '';
    for (const k of kids.slice(0, 3)) {
      const s = document.createElement('span');
      s.textContent = k.name;
      chips.appendChild(s);
    }
    n.el.classList.toggle('has-kids', kids.length > 0);
    n.el.classList.toggle('selected', id === selectedId);
    n.el.setAttribute('aria-label', e.name);
  }
  function updateCrowd() {
    let area = 0, maxD = 0;
    for (const n of nodes.values()) { area += Math.PI * (n.d / 2) ** 2; maxD = Math.max(maxD, n.d); }
    let s = 1;
    if (area > 0 && W && H) s = Math.min(1, Math.sqrt((CROWD_FILL * W * H) / area));
    if (maxD > 0 && W && H) s = Math.min(s, (Math.min(W, H) * 0.86) / maxD);
    crowd = Math.max(0.3, s);
  }
  function refreshAll() {
    for (const id of nodes.keys()) refreshNode(id);
    updateCrowd();
  }
  function markSelected() {
    for (const [id, n] of nodes) n.el.classList.toggle('selected', id === selectedId);
  }

  function buildView({ appear = false } = {}) {
    layer.textContent = '';
    nodes = new Map();
    measure();
    for (const b of childrenOf(view)) addNode(b, { appear });
    refreshAll();
    renderCrumbs();
    renderCount();
    renderTray();
    applySearch();
  }

  // ---------- 漂浮与散开 ----------
  let drag = null;
  const isDragged = (n) => !!(drag && drag.moved && drag.node === n);

  function step(t, dt) {
    const arr = [...nodes.values()];
    for (const n of arr) {
      if (isDragged(n)) continue;
      n.vx += Math.sin(t * 0.00042 + n.phase) * 0.006 * dt;
      n.vy += Math.cos(t * 0.00037 + n.phase * 1.7) * 0.006 * dt;
    }
    // 互相挤开（拖着的那颗先不参与，松手后再慢慢散开）
    for (let i = 0; i < arr.length; i++) {
      for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j];
        if (isDragged(a) || isDragged(b)) continue;
        let dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.hypot(dx, dy);
        const min = ((a.d + b.d) / 2 + GAP) * crowd;
        if (dist >= min) continue;
        if (dist < 0.01) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; dist = Math.hypot(dx, dy); }
        const push = (min - dist) * 0.045 * dt * 0.5;
        const ux = dx / dist, uy = dy / dist;
        a.vx -= ux * push; a.vy -= uy * push;
        b.vx += ux * push; b.vy += uy * push;
      }
    }
    for (const n of arr) {
      if (isDragged(n)) continue;
      const r = (n.d * crowd) / 2, pad = 10;
      const minX = r + pad, maxX = W - r - pad, minY = r + pad, maxY = H - r - pad;
      if (n.x < minX) n.vx += (minX - n.x) * 0.04 * dt; else if (n.x > maxX) n.vx -= (n.x - maxX) * 0.04 * dt;
      if (n.y < minY) n.vy += (minY - n.y) * 0.04 * dt; else if (n.y > maxY) n.vy -= (n.y - maxY) * 0.04 * dt;
      const damp = Math.pow(0.88, dt);
      n.vx *= damp; n.vy *= damp;
      const sp = Math.hypot(n.vx, n.vy);
      if (sp > 14) { n.vx *= 14 / sp; n.vy *= 14 / sp; }
      n.x += n.vx * dt; n.y += n.vy * dt;
    }
  }
  function draw() {
    for (const n of nodes.values()) {
      const D = Math.round(n.d * crowd);
      if (D !== n.shown) {
        n.shown = D;
        n.el.style.width = n.el.style.height = D + 'px';
        n.el.style.setProperty('--d', D);
        const cls = D >= SIZE_LARGE ? 'l' : D >= SIZE_MEDIUM ? 'm' : 's';
        if (cls !== n.cls) {
          if (n.cls) n.el.classList.remove('sz-' + n.cls);
          n.el.classList.add('sz-' + cls);
          n.cls = cls;
        }
      }
      n.el.style.transform = `translate3d(${(n.x - D / 2).toFixed(1)}px, ${(n.y - D / 2).toFixed(1)}px, 0)`;
    }
  }
  let last = performance.now();
  function tick(t) {
    const dt = Math.min(2, Math.max(0, (t - last) / 16.67));
    last = t;
    step(t, dt);
    draw();
    requestAnimationFrame(tick);
  }

  // ---------- 拖拽 / 单击 / 双击 ----------
  const local = (e) => {
    const r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  let clickTimer = null;
  const cancelPendingClick = () => { clearTimeout(clickTimer); clickTimer = null; };
  function scheduleClick(id) {
    cancelPendingClick();
    clickTimer = setTimeout(() => { clickTimer = null; openPanel(id); }, CLICK_DELAY);
  }

  layer.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || busy) return;
    const el = e.target.closest('.bubble');
    if (!el) return;
    const node = nodes.get(el.dataset.id);
    if (!node) return;
    const p = local(e);
    drag = { node, id: node.id, sx: p.x, sy: p.y, ox: p.x - node.x, oy: p.y - node.y, moved: false, pointerId: e.pointerId };
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  });
  layer.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const p = local(e);
    if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 4) {
      drag.moved = true;
      drag.node.el.classList.add('dragging');
      cancelPendingClick();
    }
    if (drag.moved) {
      const n = drag.node;
      const nx = clamp(p.x - drag.ox, 0, W), ny = clamp(p.y - drag.oy, 0, H);
      n.vx = (nx - n.x) * 0.25; n.vy = (ny - n.y) * 0.25;
      n.x = nx; n.y = ny;
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pointerId) return;
    const d = drag;
    drag = null;
    d.node.el.classList.remove('dragging');
    if (d.moved) persist();
    else if (e.type === 'pointerup') scheduleClick(d.id);
  }
  layer.addEventListener('pointerup', endDrag);
  layer.addEventListener('pointercancel', endDrag);
  layer.addEventListener('dblclick', (e) => {
    const el = e.target.closest('.bubble');
    if (!el) return;
    cancelPendingClick();
    enterBubble(el.dataset.id);
  });
  stage.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.bubble')) return;
    if (!panel.classList.contains('open')) { selectedId = null; markSelected(); }
  });

  // ---------- 走进泡泡 / 退出泡泡 ----------
  function resetLayerFrom(transform, origin) {
    layer.style.transition = 'none';
    layer.style.transformOrigin = origin;
    layer.style.transform = transform;
    layer.style.opacity = '0';
    void layer.offsetWidth;
    layer.style.transition = '';
    layer.style.transform = '';
    layer.style.opacity = '';
  }
  function enterBubble(id) {
    const n = nodes.get(id);
    if (busy || !n) return;
    if (draft) closePanel({ commit: true });
    selectedId = id;
    markSelected();
    persist();
    busy = true;
    layer.style.transformOrigin = `${n.x}px ${n.y}px`;
    layer.classList.add('leaving-in');
    setTimeout(() => {
      view = id;
      selectedId = null;
      layer.classList.remove('leaving-in');
      layer.style.transition = 'none';
      buildView();
      resetLayerFrom('scale(.8)', '50% 50%');
      setTimeout(() => { busy = false; }, 430);
    }, 420);
  }
  function goTo(target) {
    if (busy || target === view) return;
    if (draft) closePanel({ commit: true });
    persist();
    const path = pathIds(view);
    const fromChild = target === null ? path[0] : path[path.indexOf(target) + 1];
    busy = true;
    layer.style.transformOrigin = '50% 50%';
    layer.classList.add('leaving-out');
    setTimeout(() => {
      view = target;
      selectedId = fromChild || null;  // 回到上一层时，给刚出来的那颗泡泡描边
      layer.classList.remove('leaving-out');
      layer.style.transition = 'none';
      buildView();
      const n = nodes.get(fromChild);
      resetLayerFrom('scale(2.2)', n ? `${n.x}px ${n.y}px` : '50% 50%');
      setTimeout(() => { busy = false; }, 430);
    }, 380);
  }

  // ---------- 面包屑 / 计数 ----------
  const crumbsEl = $('#crumbs');
  function renderCrumbs() {
    crumbsEl.textContent = '';
    const items = [{ id: null, name: '全部想法' }, ...pathIds(view).map((id) => ({ id, name: byId(id).name }))];
    items.forEach((it, i) => {
      if (i) {
        const s = document.createElement('span');
        s.className = 'sep';
        s.textContent = '/';
        crumbsEl.appendChild(s);
      }
      const isLast = i === items.length - 1;
      const el = document.createElement(isLast ? 'span' : 'button');
      el.className = isLast ? 'crumb current' : 'crumb';
      el.textContent = it.name;
      if (!isLast) el.addEventListener('click', () => goTo(it.id));
      crumbsEl.appendChild(el);
    });
  }
  function renderCount() {
    const n = childrenOf(view).length;
    $('#count').textContent = n ? `${n} 颗泡泡，在这里慢慢生长` : '这里还空着，点「新建泡泡」吹一颗吧';
  }

  // ---------- 搜索 ----------
  const searchEl = $('#search');
  function deepMatch(b, q) {
    const e = eff(b);
    if (e.name.toLowerCase().includes(q) || e.note.toLowerCase().includes(q)) return true;
    return childrenOf(b.id).some((c) => deepMatch(c, q));
  }
  function applySearch() {
    const q = query.trim().toLowerCase();
    stage.classList.toggle('searching', !!q);
    for (const [id, n] of nodes) {
      const b = byId(id);
      n.el.classList.toggle('hit', !!(q && b && deepMatch(b, q)));
    }
  }
  searchEl.addEventListener('input', () => { query = searchEl.value; applySearch(); });

  // ---------- 已完成的小泡泡 ----------
  const trayBtn = $('#trayBtn'), trayPop = $('#trayPop');
  function renderTray() {
    const done = state.bubbles.filter((b) => b.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    $('#trayCount').textContent = done.length;
    const ul = $('#trayList');
    ul.textContent = '';
    if (!done.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = '还没有吹掉的泡泡。';
      ul.appendChild(li);
      return;
    }
    for (const b of done) {
      const li = document.createElement('li');
      li.style.setProperty('--c', COLORS[b.color].rgb.join(' '));
      const dot = document.createElement('span'); dot.className = 'dot';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = b.name; nm.title = b.name;
      const tm = document.createElement('time');
      if (b.doneAt) {
        const d = new Date(b.doneAt);
        tm.dateTime = d.toISOString();
        tm.textContent = `${d.getMonth() + 1}/${d.getDate()} 完成`;
      }
      li.append(dot, nm, tm);
      ul.appendChild(li);
    }
  }
  trayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = trayPop.hidden;
    closeMenus();
    trayPop.hidden = !open;
    trayBtn.setAttribute('aria-expanded', String(open));
  });

  // ---------- 面板「这一颗想法」 ----------
  const panel = $('#panel');
  const fName = $('#fName'), fNote = $('#fNote'), fColors = $('#fColors');
  const fSizeMode = $('#fSizeMode'), fSize = $('#fSize'), sizeBox = $('#sizeBox');
  const fParent = $('#fParent');

  for (const key of COLOR_ORDER) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch';
    btn.dataset.color = key;
    btn.setAttribute('role', 'radio');
    btn.setAttribute('aria-label', COLORS[key].label);
    btn.style.setProperty('--c', COLORS[key].rgb.join(' '));
    btn.addEventListener('click', () => {
      if (!draft) return;
      draft.color = key;
      syncSwatches();
      previewDraft();
    });
    fColors.appendChild(btn);
  }
  function syncSwatches() {
    for (const s of fColors.children) s.setAttribute('aria-checked', String(!!draft && s.dataset.color === draft.color));
  }
  function syncSizeBox() {
    if (!draft) return;
    const n = childrenOf(draft.id).length;
    $('#sizeLine').textContent = `${n} 个小泡泡 · 自动大小 ${autoSize(n)}`;
    sizeBox.classList.toggle('manual', draft.sizeMode === 'manual');
    fSize.value = draft.size;
    $('#sizeVal').textContent = Math.round(draft.size);
  }
  function fillParentOptions(b) {
    const banned = new Set([b.id, ...descendantsOf(b.id).map((x) => x.id)]);
    fParent.textContent = '';
    fParent.appendChild(new Option('自由漂浮 · 主地图', ''));
    const walk = (pid, prefix) => {
      for (const c of childrenOf(pid)) {
        if (banned.has(c.id)) continue;
        fParent.appendChild(new Option(`放进 · ${prefix}${c.name}`, c.id));
        walk(c.id, `${prefix}${c.name} › `);
      }
    };
    walk(null, '');
    fParent.value = draft.parentId || '';
  }
  function previewDraft() {
    if (!draft) return;
    refreshNode(draft.id);
    updateCrowd();
    applySearch();
  }

  function openPanel(id, { focusName = false } = {}) {
    const b = byId(id);
    if (!b || !nodes.has(id)) return;
    if (draft && draft.id !== id) commitDraft();
    if (!draft || draft.id !== id) {
      draft = {
        id, name: b.name, note: b.note, color: b.color, sizeMode: b.sizeMode,
        size: b.sizeMode === 'manual' ? b.size : clamp(autoSize(childrenOf(id).length), MIN_SIZE, MAX_SIZE),
        parentId: b.parentId,
      };
    }
    selectedId = id;
    markSelected();
    closeMenus();
    fName.value = draft.name;
    fNote.value = draft.note;
    fSizeMode.value = draft.sizeMode;
    syncSwatches();
    syncSizeBox();
    fillParentOptions(b);
    panel.classList.add('open');
    panel.setAttribute('aria-hidden', 'false');
    if (focusName) { fName.focus(); fName.select(); }
  }
  function hidePanel() {
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    if (panel.contains(document.activeElement)) document.activeElement.blur();
  }
  function commitDraft() {
    if (!draft) return;
    const d = draft;
    draft = null;
    const b = byId(d.id);
    if (!b) return;
    const moved = (d.parentId || null) !== (b.parentId || null);
    b.name = d.name.trim().slice(0, 60) || '未命名的想法';
    b.note = d.note;
    b.color = d.color;
    b.sizeMode = d.sizeMode;
    b.size = clamp(Math.round(d.size), MIN_SIZE, MAX_SIZE);
    if (moved) {
      b.parentId = d.parentId || null;
      b.pos = null;
      if (b.parentId !== view) {
        popNode(b.id, 'shrink');
        if (selectedId === b.id) selectedId = null;
      }
    }
    persist();
    refreshAll();
    renderCount();
    applySearch();
  }
  function closePanel({ commit = false } = {}) {
    if (commit) commitDraft();
    else if (draft) {
      const id = draft.id;
      draft = null;
      refreshNode(id);
      updateCrowd();
      applySearch();
    }
    hidePanel();
    markSelected();
  }

  fName.addEventListener('input', () => { if (draft) { draft.name = fName.value; previewDraft(); } });
  fNote.addEventListener('input', () => { if (draft) { draft.note = fNote.value; applySearch(); } });
  fSizeMode.addEventListener('change', () => { if (draft) { draft.sizeMode = fSizeMode.value; syncSizeBox(); previewDraft(); } });
  fSize.addEventListener('input', () => { if (draft) { draft.size = Number(fSize.value); $('#sizeVal').textContent = fSize.value; previewDraft(); } });
  fParent.addEventListener('change', () => { if (draft) draft.parentId = fParent.value || null; });
  $('#panelClose').addEventListener('click', () => closePanel());
  $('#saveBtn').addEventListener('click', () => closePanel({ commit: true }));

  $('#blowBtn').addEventListener('click', () => {
    if (!draft) return;
    const id = draft.id;
    const d = draft;
    draft = null;
    const b = byId(id);
    if (!b) return;
    b.name = d.name.trim().slice(0, 60) || '未命名的想法';
    b.note = d.note;
    b.color = d.color;
    b.sizeMode = d.sizeMode;
    b.size = clamp(Math.round(d.size), MIN_SIZE, MAX_SIZE);
    b.done = true;
    b.doneAt = Date.now();
    selectedId = null;
    hidePanel();
    popNode(id, 'pop');
    persist();
    refreshAll();
    renderCount();
    renderTray();
    applySearch();
  });

  $('#deleteBtn').addEventListener('click', () => {
    if (!draft) return;
    const b = byId(draft.id);
    if (!b) return;
    const desc = descendantsOf(b.id);
    const name = (draft.name.trim() || b.name);
    const msg = desc.length
      ? `删除「${name}」？\n里面的 ${desc.length} 个小泡泡也会一起删除，删除后不能恢复。`
      : `删除「${name}」？删除后不能恢复。`;
    if (!window.confirm(msg)) return;
    const kill = new Set([b.id, ...desc.map((x) => x.id)]);
    draft = null;
    selectedId = null;
    hidePanel();
    popNode(b.id, 'pop');
    state.bubbles = state.bubbles.filter((x) => !kill.has(x.id));
    persist();
    refreshAll();
    renderCount();
    renderTray();
    applySearch();
  });

  // ---------- 新建泡泡 ----------
  $('#newBtn').addEventListener('click', () => {
    if (busy) return;
    if (draft) commitDraft();
    measure();
    // 放在面板左边的可见区域中间附近
    const visibleW = Math.max(W - 360, W * 0.5);
    const b = {
      id: uid(), name: '新的想法', note: '', color: 'pink', sizeMode: 'auto', size: AUTO_BASE, parentId: view,
      done: false, doneAt: null, createdAt: Date.now(),
      pos: { x: clamp((visibleW / 2 + (Math.random() - 0.5) * 80) / W, 0.05, 0.95), y: clamp(0.5 + (Math.random() - 0.5) * 0.2, 0.05, 0.95) },
    };
    state.bubbles.push(b);
    addNode(b, { appear: true });
    refreshAll();
    renderCount();
    applySearch();
    persist();
    openPanel(b.id, { focusName: true });
  });

  // ---------- 备份 ⇅ ----------
  const backupBtn = $('#backupBtn'), backupMenu = $('#backupMenu'), importFile = $('#importFile');
  function closeMenus() {
    backupMenu.hidden = true;
    backupBtn.setAttribute('aria-expanded', 'false');
    trayPop.hidden = true;
    trayBtn.setAttribute('aria-expanded', 'false');
  }
  backupBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const open = backupMenu.hidden;
    closeMenus();
    backupMenu.hidden = !open;
    backupBtn.setAttribute('aria-expanded', String(open));
  });
  function backupJSON() {
    savePositions();
    return JSON.stringify({ app: APP_ID, version: APP_VERSION, exportedAt: new Date().toISOString(), bubbles: state.bubbles }, null, 2);
  }
  $('#exportBtn').addEventListener('click', () => {
    closeMenus();
    const blob = new Blob([backupJSON()], { type: 'application/json' });
    const d = new Date();
    const stamp = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `idear泡泡备份-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  });
  $('#importBtn').addEventListener('click', () => { closeMenus(); importFile.value = ''; importFile.click(); });
  function restoreFrom(text) {
    let data = null;
    try { data = sanitize(JSON.parse(text)); } catch (e) { data = null; }
    if (!data) { window.alert(`这个文件看起来不是 ${APP_NAME}的备份。`); return false; }
    const cur = state.bubbles.length;
    if (!window.confirm(`用备份里的 ${data.bubbles.length} 颗泡泡，替换现在的 ${cur} 颗？`)) return false;
    draft = null;
    selectedId = null;
    hidePanel();
    state = data;
    view = null;
    nodes = new Map();      // 先清空，避免把旧画面的坐标写进新数据
    persist();
    buildView({ appear: true });
    return true;
  }
  importFile.addEventListener('change', () => {
    const file = importFile.files && importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => restoreFrom(String(reader.result));
    reader.onerror = () => window.alert('读取备份文件失败。');
    reader.readAsText(file);
  });

  // ---------- 全局 ----------
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#backupMenu, #backupBtn, #trayPop, #trayBtn')) closeMenus();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!backupMenu.hidden || !trayPop.hidden) { closeMenus(); return; }
    if (panel.classList.contains('open')) closePanel();
  });
  window.addEventListener('resize', () => {
    const oW = W, oH = H;
    measure();
    if (oW && oH) for (const n of nodes.values()) { n.x *= W / oW; n.y *= H / oH; }
    updateCrowd();
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(); });
  window.addEventListener('pagehide', persist);

  buildView({ appear: true });
  persist();
  requestAnimationFrame((t) => { last = t; tick(t); });
})();
</script>
</body>
</html>
